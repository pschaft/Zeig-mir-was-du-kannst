<!doctype html>
<html lang="de" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Unikram</title>
  <meta name="description" content="Dein ganzer Unikram in einer App: Stundenplan, Aufgaben, Fokus-Timer, Karteikarten, Noten, Budget, WG-Kasse, Lernplan und mehr – offline und privat.">
  <meta name="theme-color" content="#f4f5f9">
  <meta name="color-scheme" content="light dark">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Unikram">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="stylesheet" href="css/app.css">
  <script>
    // Theme vor dem ersten Rendern setzen (kein Aufblitzen)
    try {
      var s = JSON.parse(localStorage.getItem('unikram:v1') || '{}').settings || {};
      var dark = s.theme === 'dark' || ((!s.theme || s.theme === 'system') && matchMedia('(prefers-color-scheme: dark)').matches);
      document.documentElement.dataset.theme = dark ? 'dark' : 'light';
      if (s.accent) document.documentElement.style.setProperty('--accent', s.accent);
    } catch (e) {}
  </script>
  <script type="module" src="js/app.js"></script>
</head>
<body>
  <div id="app" class="app">
    <aside id="sidebar" class="sidebar" aria-label="Navigation"></aside>
    <main id="view" class="view" tabindex="-1"></main>
    <nav id="tabbar" class="tabbar" aria-label="Hauptnavigation"></nav>
  </div>
  <div id="toasts" class="toasts" aria-live="polite"></div>
  <noscript><p style="padding:24px;font-family:sans-serif">Unikram braucht JavaScript.</p></noscript>
</body>
</html>
